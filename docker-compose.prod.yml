# Single-host production stack: PostgreSQL + PressFlow API + worker + web.
#
#   cp .env.production.example .env.production    # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec api python -m app.checks
#
# Nothing here has a default secret: a missing value stops `docker compose` before anything starts.
# Put TLS in front (Caddy, nginx, a cloud load balancer) and forward to web:3000. Only the web port is published;
# the API is reached through the web app's /api/v1 proxy. Publish api:8000 too only if an InDesign bridge on
# another machine has to reach it, and then behind TLS.
#
# Files are kept in S3-compatible storage (AWS S3, Cloudflare R2, ...), so the API and worker share nothing on
# disk and the host can be replaced without losing uploads.
name: pressflow-prod

x-api-env: &api-env
  ENV: production
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY}
  DATABASE_URL: postgresql://pressflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pressflow
  COOKIE_SECURE: "true"
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL, e.g. https://magazine.example.com}
  CORS_ORIGINS: ${FRONTEND_URL}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-}
  ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
  SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  RUN_WORKER_INLINE: "false"
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  LLM_MODEL: ${LLM_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-none}
  TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  INDESIGN_BRIDGE_TOKEN: ${INDESIGN_BRIDGE_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pressflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pressflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressflow"]
      interval: 5s
      retries: 10

  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: {context: ., dockerfile: services/api/Dockerfile}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    depends_on:
      api: {condition: service_healthy}

  web:
    build: {context: apps/web, dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      PRESSFLOW_API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["${WEB_PORT:-3000}:3000"]

volumes:
  pgdata:
