# Local stack: PostgreSQL + MinIO (S3) + PressFlow API + worker.
#   docker compose up --build
# Secrets below are local-development placeholders only.
name: pressflow

x-api-env: &api-env
  ENV: production
  SECRET_KEY: ${SECRET_KEY:-change-me-local-dev-secret-key-0123456789}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
  DATABASE_URL: postgresql://pressflow:pressflow@postgres:5432/pressflow
  STORAGE_BACKEND: s3
  S3_BUCKET: pressflow
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: pressflow
  S3_SECRET_ACCESS_KEY: pressflow-minio-secret
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  CORS_ORIGINS: http://localhost:3000
  RUN_WORKER_INLINE: "false"
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  LLM_MODEL: ${LLM_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-none}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  INDESIGN_BRIDGE_TOKEN: ${INDESIGN_BRIDGE_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pressflow
      POSTGRES_PASSWORD: pressflow
      POSTGRES_DB: pressflow
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressflow"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pressflow
      MINIO_ROOT_PASSWORD: pressflow-minio-secret
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 pressflow pressflow-minio-secret &&
             mc mb --ignore-existing local/pressflow"

  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["8000:8000"]

  worker:
    build: {context: ., dockerfile: services/api/Dockerfile}
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    depends_on:
      api: {condition: service_started}

  web:
    build: {context: apps/web, dockerfile: Dockerfile}
    environment:
      # Server-side only: the browser always calls /api/v1 on the web origin.
      PRESSFLOW_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
