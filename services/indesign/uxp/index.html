<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PressFlow</title>
  <style>
    body { font-family: sans-serif; font-size: 12px; color: var(--uxp-host-text-color, #ddd); background: var(--uxp-host-background-color, #323232); padding: 8px; }
    h2 { font-size: 14px; margin: 0 0 8px; }
    fieldset { border: 1px solid #555; padding: 6px 8px; margin: 0 0 10px; }
    legend { padding: 0 4px; }
    label { display: block; margin: 4px 0; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    ul { list-style: none; padding: 0; margin: 4px 0; max-height: 160px; overflow-y: auto; }
    li { padding: 3px 0; border-bottom: 1px solid #444; }
    .muted { opacity: 0.7; }
    .ok { color: #7fd17f; }
    .err { color: #ff8080; }
    #log { white-space: pre-wrap; font-family: monospace; font-size: 11px; max-height: 220px; overflow-y: auto; background: #262626; padding: 6px; margin: 0; }
  </style>
</head>
<body>
  <h2>PressFlow Render</h2>

  <fieldset>
    <legend>Settings</legend>
    <label>PressFlow API URL
      <input id="apiUrl" type="text" placeholder="https://pressflow.example.com">
    </label>
    <label>Bridge token
      <input id="token" type="password" placeholder="stored in UXP secure storage">
    </label>
    <label>Bridge ID
      <input id="bridgeId" type="text">
    </label>
    <label><input id="keepOpen" type="checkbox" checked> Keep rendered document open for review</label>
    <div class="row">
      <button id="saveSettings">Save settings</button>
      <span id="settingsStatus" class="muted"></span>
    </div>
  </fieldset>

  <fieldset>
    <legend>Render queue</legend>
    <div class="row">
      <button id="refreshJobs">Refresh queue</button>
      <button id="renderJob">Render next job</button>
    </div>
    <ul id="jobs"><li class="muted">Not loaded yet.</li></ul>
  </fieldset>

  <div id="status" class="muted">Idle.</div>
  <pre id="log"></pre>

  <script src="main.js"></script>
</body>
</html>
