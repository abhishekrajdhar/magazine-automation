[project]
name = "pressflow-api"
version = "0.1.0"
description = "Elets PressFlow AI backend: event media -> editorial -> magazine layout, with reference-magazine design intelligence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pymupdf>=1.25",
  "pillow>=11.0",
  "numpy>=2.1",
  "reportlab>=4.2",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "cryptography>=43",
  "jsonschema>=4.23",
  "anthropic>=0.70",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
whisper-local = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:reportlab.*",
  "ignore:builtin type Swig:DeprecationWarning",
  "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.uv]
package = false
